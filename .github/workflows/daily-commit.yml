name: Daily Auto Commit

on:
  schedule:
    # Uruchamia się codziennie o godzinie 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Pozwala uruchomić plik ręcznie w dowolnym momencie

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update log
        run: |
          echo "Automated commit: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> activity.log

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add activity.log
          git commit -m "chore(auto): update activity log [skip ci]"
          git push
